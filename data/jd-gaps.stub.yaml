# ============================================================================
#  FICTIONAL demo JD-gap corpus — INVENTED. Safe to commit / publish.
# ============================================================================
# This repo is built in public, but the real career data is private (see
# CLAUDE.md, "Build in public"). Everything below is a MADE-UP example profile
# for a fictional "Sample Learner" — invented skills, invented JD frequencies,
# invented self-assessment. It exists only to demo the agent and drive the
# public eval. It is NOT anyone's real skill map, gap ranking, or job-market
# analysis, and must not be read as one.
#
# The REAL corpus (real frequencies + real self-assessment) is never committed.
# Point the agent at it with:
#     export LTS_CORPUS_PATH=/path/to/private/jd-gaps.yaml
# or, later, a private MCP server. Default (unset) = this fictional demo.
#
# Field reference: id, competency, freq (share of JDs, 0..1), level
# (strong|solid|gap|partial|route_around|edge), priority (gap-ranking slot or
# null), leverage (closing weight in [0,1] the ranker sorts by), keywords
# (lowercase match terms). Priorities/leverage here are just an evenly-spaced
# fictional ladder so the demo has a clear, deterministic order.

version: demo-1
derived: fictional
source: INVENTED — "Sample Learner" demo profile, not real career data
n_jds: 0

