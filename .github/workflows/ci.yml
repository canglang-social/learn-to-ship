name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    name: lint + eval harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # The eval harness runs inside pytest. A failing eval (ranking regression)
      # returns non-zero and fails the build — the acceptance criterion.
      - name: Run tests + eval harness
        run: uv run pytest -q
