[project]
name = "learn-to-ship"
version = "1.2.0"
description = "Output-driven learning agent: rank study items by which JD gap they unblock."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "langchain-anthropic>=1.4.8",
    "langgraph>=1.2.7",
    "mcp>=1.28.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.50.0",
]

[project.scripts]
learn-to-ship = "learn_to_ship.__main__:main"

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "langgraph-cli[inmem]>=0.4.30",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["learn_to_ship"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# `live` tests hit the real Claude API; deselect by default (CI runs without a key).
# Run them with: uv run pytest -m live
addopts = "-m 'not live'"
markers = ["live: exercises the real Claude API (needs ANTHROPIC_API_KEY)"]
